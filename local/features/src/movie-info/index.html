<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Info Dashboard</title>
    <script type="module" src="@/common/index.ts" charset="utf-8"></script>
    <script type="module" src="@/movie-info/index.ts" charset="utf-8"></script>
  </head>
  <body>
    <div id="movie-info-app">
      <div id="common-header-container"></div>
      <main class="app-main">
        <section class="video-selector">
          <h1>動画データ統合ダッシュボード</h1>
          <div class="video-input-row">
            <label for="video-id-input">動画ID</label>
            <input id="video-id-input" type="text" placeholder="sm9 または URL" />
            <button id="load-data-btn" type="button">データ取得</button>
            <button id="fetch-comments-btn" type="button" disabled>コメントを取得</button>
          </div>
          <p class="video-hint">自動取得できない場合は動画IDまたはウォッチURLを入力してください。</p>
          <p id="global-status" class="global-status"></p>
        </section>

        <section class="panel-grid">
          <article id="panel-watch-api" class="info-panel">
            <header class="panel-header">
              <h2>ウォッチAPI (apiData)</h2>
              <div class="panel-actions">
                <button data-role="copy" type="button" disabled>JSONコピー</button>
                <button data-role="download" type="button" disabled>JSONダウンロード</button>
              </div>
            </header>
            <div class="panel-body">
              <p class="panel-status" data-role="status"></p>
              <div class="panel-summary" data-role="summary"></div>
              <button class="show-json-btn" data-role="show-json" type="button" hidden disabled>Raw JSONを表示</button>
            </div>
          </article>

          <article id="panel-cache-info" class="info-panel">
            <header class="panel-header">
              <h2>キャッシュ情報 (cache/info/v2)</h2>
              <div class="panel-actions">
                <button data-role="copy" type="button" disabled>JSONコピー</button>
                <button data-role="download" type="button" disabled>JSONダウンロード</button>
              </div>
            </header>
            <div class="panel-body">
              <p class="panel-status" data-role="status"></p>
              <div class="panel-summary" data-role="summary"></div>
              <button class="show-json-btn" data-role="show-json" type="button" hidden disabled>Raw JSONを表示</button>
            </div>
          </article>

          <article id="panel-thumb-info" class="info-panel">
            <header class="panel-header">
              <h2>サムネイル情報 (ext-thumb API)</h2>
              <div class="panel-actions">
                <button data-role="copy" type="button" disabled>JSONコピー</button>
                <button data-role="download" type="button" disabled>JSONダウンロード</button>
              </div>
            </header>
            <div class="panel-body">
              <p class="panel-status" data-role="status"></p>
              <div class="panel-summary" data-role="summary"></div>
              <button class="show-json-btn" data-role="show-json" type="button" hidden disabled>Raw JSONを表示</button>
            </div>
          </article>

          <article id="panel-media-info" class="info-panel">
            <header class="panel-header">
              <h2>MediaInfo (mediainfo JSON)</h2>
              <div class="panel-actions">
                <button data-role="copy" type="button" disabled>JSONコピー</button>
                <button data-role="download" type="button" disabled>JSONダウンロード</button>
              </div>
            </header>
            <div class="panel-body">
              <p class="panel-status" data-role="status"></p>
              <div class="panel-summary" data-role="summary"></div>
              <button class="show-json-btn" data-role="show-json" type="button" hidden disabled>Raw JSONを表示</button>
            </div>
          </article>

          <article id="panel-comments" class="info-panel">
            <header class="panel-header">
              <h2>コメント &amp; apiData (選択時取得)</h2>
              <div class="panel-actions">
                <button data-role="copy" type="button" disabled>JSONコピー</button>
                <button data-role="download" type="button" disabled>JSONダウンロード</button>
              </div>
            </header>
            <div class="panel-body">
              <p class="panel-status" data-role="status"></p>
              <div class="panel-summary" data-role="summary"></div>
              <button class="show-json-btn" data-role="show-json" type="button" hidden disabled>Raw JSONを表示</button>
            </div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
