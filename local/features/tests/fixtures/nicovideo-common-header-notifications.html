<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>CommonHeader notification fixture</title>
  </head>
  <body>
    <!-- CommonHeader 3.13.0を2026-08-23にde-minifyして確認した、ベルと通知パネルの安定構造だけを再構成。生成class名と個人情報は保存しない。 -->
    <header id="CommonHeader">
      <div data-fixture="notification-wrapper">
        <div id="official-bell-trigger" data-fixture="bell-trigger">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a6 6 0 0 0-6 6v4l-2 3h16l-2-3V8a6 6 0 0 0-6-6Z" />
          </svg>
          <span data-fixture="unread-dot"></span>
        </div>
        <div data-fixture="notification-panel">
          <div data-fixture="notification-header">
            <div>お知らせ</div>
            <a href="https://inform.nicovideo.jp/oshirase/settings" target="_blank">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" />
              </svg>
            </a>
          </div>
          <div data-fixture="notification-list">
            <a href="https://www.nicovideo.jp/watch/sm9">匿名化した未読通知</a>
          </div>
          <a href="https://inform.nicovideo.jp/oshirase/list">お知らせ一覧へ</a>
        </div>
      </div>
    </header>
  </body>
</html>
