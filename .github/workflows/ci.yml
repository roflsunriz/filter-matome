name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies (features)
        run: |
          cd local/features
          bun install

      - name: Build features
        run: |
          cd local/features
          bun run build:ALL

      # nl-media-info は features に統合済みのため個別ビルドは不要

      - name: Lint check
        run: |
          cd local/features
          bun run lint

      - name: Type check
        run: |
          cd local/features
          bun run type-check


      - name: Validate nlFilters syntax
        run: |
          echo "Validating nlFilter files..."
          # 基本的な構文チェック（100-199番台のファイル）
          for file in nlFilters/1[0-9][0-9]_*.txt; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              # 基本的なnlFilter構文の存在確認
              if ! grep -q '\[Replace\]\|\[Script\]\|\[Style\]\|\[RequestHeader\]' "$file"; then
                echo "Warning: $file may not contain valid nlFilter syntax"
              fi
            fi
          done
          echo "nlFilter validation completed."

      - name: Check file structure
        run: |
          echo "Checking project structure..."
          
          # 必須ディレクトリの確認
          required_dirs=(
            "nlFilters"
            "local/features"
            "local/features/src"
          )
          
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Error: Required directory $dir is missing"
              exit 1
            else
              echo "✓ $dir exists"
            fi
          done
          
          # 重要ファイルの確認
          important_files=(
            "README.md"
            "LICENSE"
            "creating-symlink-for-listjs.md"
            "nlFilters/199_readme.html"
            "nlFilters/198_release_notes.md"
            "nlFilters/nlFilters_編集ガイド.md"
            "extensions/CommentFilterLogger.java"
            "extensions/CommentFilterLogger.class"
            "extensions/CustomCacheReturner.java"
            "extensions/CustomCacheReturner.class"
            "extensions/downloadThruFFmpeg.java"
            "extensions/downloadThruFFmpeg.class"
            "extensions/ExtUtil.java"
            "extensions/ExtUtil.class"
          )
          
          for file in "${important_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Warning: Important file $file is missing"
            else
              echo "✓ $file exists"
            fi
          done
          
          echo "File structure check completed."

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            local/features/dist/
            extensions/CommentFilterLogger.*
            extensions/CustomCacheReturner.*
            extensions/downloadThruFFmpeg.*
            extensions/ExtUtil.*
          retention-days: 7