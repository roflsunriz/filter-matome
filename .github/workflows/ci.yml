name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────
  # ジョブ①: Lint + 型チェック（ビルド不要・高速フィードバック）
  # ─────────────────────────────────────────────
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('local/features/bun.lock', 'local/features/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: local/features
        run: bun install

      - name: Lint check
        working-directory: local/features
        run: bun run lint

      - name: Type check
        working-directory: local/features
        run: bun run type-check

  # ─────────────────────────────────────────────
  # ジョブ②: ビルド + アーティファクト保存
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('local/features/bun.lock', 'local/features/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: local/features
        run: bun install

      - name: Build features
        working-directory: local/features
        run: bun run build:ALL

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            local/features/dist/
            extensions/CommentFilterLogger.*
            extensions/CustomCacheReturner.*
            extensions/downloadThruFFmpeg.*
            extensions/ExtUtil.*
          retention-days: 7

  # ─────────────────────────────────────────────
  # ジョブ③: 構造・構文バリデーション（Bun/Java 不要・軽量）
  # ─────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate nlFilters syntax
        run: |
          echo "Validating nlFilter files..."
          # 基本的な構文チェック（100-199番台のファイル）
          for file in nlFilters/1[0-9][0-9]_*.txt; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              # 基本的なnlFilter構文の存在確認
              if ! grep -q '\[Replace\]\|\[Script\]\|\[Style\]\|\[RequestHeader\]' "$file"; then
                echo "Warning: $file may not contain valid nlFilter syntax"
              fi
            fi
          done
          echo "nlFilter validation completed."

      - name: Check file structure
        run: |
          echo "Checking project structure..."

          # 必須ディレクトリの確認
          required_dirs=(
            "nlFilters"
            "local/features"
            "local/features/src"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Error: Required directory $dir is missing"
              exit 1
            else
              echo "✓ $dir exists"
            fi
          done

          # 重要ファイルの確認
          important_files=(
            "README.md"
            "LICENSE"
            "docs/creating-symlink-for-listjs.md"
            "CHANGELOG.md"
            "docs/USAGE.md"
            "nlFilters/nlFilters_編集ガイド.md"
            "extensions/CommentFilterLogger.java"
            "extensions/CommentFilterLogger.class"
            "extensions/CustomCacheReturner.java"
            "extensions/CustomCacheReturner.class"
            "extensions/downloadThruFFmpeg.java"
            "extensions/downloadThruFFmpeg.class"
            "extensions/ExtUtil.java"
            "extensions/ExtUtil.class"
          )

          for file in "${important_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Warning: Important file $file is missing"
            else
              echo "✓ $file exists"
            fi
          done

          echo "File structure check completed."
