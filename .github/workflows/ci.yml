name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # ジョブ①: Lint + 型チェック（ビルド不要・高速フィードバック）
  # ─────────────────────────────────────────────
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('local/features/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: local/features
        run: bun install --frozen-lockfile

      - name: Format check
        working-directory: local/features
        run: bun run format:check

      - name: Lint check
        working-directory: local/features
        run: bun run lint

      - name: Type check
        working-directory: local/features
        run: bun run type-check

      - name: Unit tests
        working-directory: local/features
        run: bun run test:unit

  # ─────────────────────────────────────────────
  # ジョブ②: ブラウザーE2E
  # ─────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('local/features/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: local/features
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: local/features
        run: bun x playwright install chromium

      - name: Run browser tests
        working-directory: local/features
        run: bun run test:e2e

      - name: Upload Playwright failure artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: local/features/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # ジョブ③: ビルド + アーティファクト保存
  # ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: scripts/java-toolbox/pom.xml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('local/features/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: local/features
        run: bun install --frozen-lockfile

      - name: Build features
        working-directory: local/features
        run: bun run build

      - name: Test and package Java Toolbox
        working-directory: scripts/java-toolbox
        run: mvn --batch-mode verify

      - name: Verify packaged artifacts
        shell: bash
        run: |
          test -f scripts/java-toolbox/target/filter-matome-toolbox-0.1.0-SNAPSHOT.jar
          test -f extensions/nlGpac.class
          test -f extensions/nlGpac.java

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: build-artifacts
          path: |
            local/features/dist/
            scripts/java-toolbox/target/filter-matome-toolbox-0.1.0-SNAPSHOT.jar
            extensions/
          retention-days: 7

  # ─────────────────────────────────────────────
  # ジョブ⑤: Java ToolboxのOS別・ヘッドレス検証
  # ─────────────────────────────────────────────
  java-toolbox-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: scripts/java-toolbox/pom.xml

      - name: Run Java Toolbox tests
        working-directory: scripts/java-toolbox
        run: mvn --batch-mode verify

  # ─────────────────────────────────────────────
  # ジョブ⑥: 構造・構文バリデーション（Bun/Java 不要・軽量）
  # ─────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate nlFilters syntax
        run: |
          echo "Validating nlFilter files..."
          # 基本的な構文チェック（100-199番台のファイル）
          for file in nlFilters/1[0-9][0-9]_*.txt; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              # 基本的なnlFilter構文の存在確認
              if ! grep -q '\[Replace\]\|\[Script\]\|\[Style\]\|\[RequestHeader\]' "$file"; then
                echo "Warning: $file may not contain valid nlFilter syntax"
              fi
            fi
          done
          echo "nlFilter validation completed."

      - name: Check file structure
        run: |
          echo "Checking project structure..."

          # 必須ディレクトリの確認
          required_dirs=(
            "nlFilters"
            "local/features"
            "local/features/src"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Error: Required directory $dir is missing"
              exit 1
            else
              echo "✓ $dir exists"
            fi
          done

          # 重要ファイルの確認
          important_files=(
            "README.md"
            "LICENSE"
            "stop-nicocache.ps1"
            "CHANGELOG.md"
            "docs/USAGE.md"
            "nlFilters/nlFilters_編集ガイド.md"
            "extensions/CommentFilterLogger.java"
            "extensions/CommentFilterLogger.class"
            "extensions/ExtUtil.java"
            "extensions/ExtUtil.class"
            "extensions/FilterMatomeSeriesAlerts.java"
            "extensions/FilterMatomeSeriesAlerts.class"
            "extensions/FilterMatomeSmartFetcher.java"
            "extensions/FilterMatomeSmartFetcher.class"
            "extensions/nlMovieFetcher.java"
            "extensions/nlMovieFetcher.class"
            "extensions/nlGpac.java"
            "extensions/nlGpac.class"
          )

          for file in "${important_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Warning: Important file $file is missing"
            else
              echo "✓ $file exists"
            fi
          done

          echo "File structure check completed."
