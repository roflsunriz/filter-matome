name: Dependabot automation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  dependabot:
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    uses: roflsunriz/myAGENTS/.github/workflows/dependabot-automation.yml@8bcb79de73249f04e83d0a6071d30ac025710a17
    with:
      ci_workflows: '["CI"]'
      callback_workflow_file: dependabot-automation.yml
      autofix_command: 'cd local/features && bun install --lockfile-only --ignore-scripts && cargo generate-lockfile --manifest-path ../../benchmarks/comment-filter-core/rust/Cargo.toml'
      autofix_paths: '["local/features/bun.lock","benchmarks/comment-filter-core/rust/Cargo.lock"]'
      autofix_workflow_files: '["ci.yml"]'
      post_merge_workflows: '["docs.yml"]'
