name: Release

on:
  push:
    tags:
      - "#*" # #188, #189 などのタグにマッチ

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # ジョブ①: ビルド → リリースアーカイブ作成（並列実行）
  # ─────────────────────────────────────────────
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: scripts/java-toolbox/pom.xml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('local/features/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: local/features
        run: bun install --frozen-lockfile

      - name: Build features
        working-directory: local/features
        run: bun run build

      - name: Build Java Toolbox
        working-directory: scripts/java-toolbox
        run: mvn --batch-mode verify

      # nlGpac はリポジトリ内のコンパイル済みクラスを配布するため個別ビルドは不要

      - name: Create release archive
        shell: bash
        run: |
          # リリース用のディレクトリを作成
          mkdir -p release/NicoCache_nl
          mkdir -p release/NicoCache_nl/extensions

          # 必要なファイルをコピー
          cp -r nlFilters release/NicoCache_nl/
          cp -r local release/NicoCache_nl/
          cp -r scripts release/NicoCache_nl/
          cp README.md release/NicoCache_nl/
          cp CHANGELOG.md release/NicoCache_nl/
          cp LICENSE release/NicoCache_nl/
          cp GUIDE.html release/NicoCache_nl/

          # Java Toolboxは実行JARだけを配布し、Mavenの開発用生成物は含めない
          rm -rf release/NicoCache_nl/scripts/java-toolbox/target
          mkdir -p release/NicoCache_nl/scripts/java-toolbox/target
          cp scripts/java-toolbox/target/filter-matome-toolbox-0.1.0-SNAPSHOT.jar release/NicoCache_nl/scripts/java-toolbox/target/
          test -f release/NicoCache_nl/scripts/java-toolbox/target/filter-matome-toolbox-0.1.0-SNAPSHOT.jar
          java -jar release/NicoCache_nl/scripts/java-toolbox/target/filter-matome-toolbox-0.1.0-SNAPSHOT.jar --list-plugins
          java -jar release/NicoCache_nl/scripts/java-toolbox/target/filter-matome-toolbox-0.1.0-SNAPSHOT.jar --headless --self-test --data-dir release/NicoCache_nl/.toolbox-release-test
          rm -rf release/NicoCache_nl/.toolbox-release-test

          # mime.typesをコピー
          cp local/mime.types release/NicoCache_nl/local/ || echo "Warning: mime.types not found in local folder"

          # 空フォルダを確実に含めるため.gitkeepファイルを作成
          touch release/NicoCache_nl/local/cache/.gitkeep || true

          # 現在の拡張機能だけを配布する。削除済みの旧補助クラスは再収録しない。
          cp extensions/*.java release/NicoCache_nl/extensions/
          cp extensions/*.class release/NicoCache_nl/extensions/
          test -f release/NicoCache_nl/extensions/nlGpac.java
          test -f release/NicoCache_nl/extensions/nlGpac.class

          # 開発用ファイルを除外（ただし、開発環境構築に必要なpackage.json等は保持）
          find release/NicoCache_nl -name "node_modules" -type d -exec rm -rf {} + || true
          find release/NicoCache_nl -name "*.map" -type f -delete || true
          # 開発環境構築に必要なファイルは削除しない
          # find release/NicoCache_nl -name "package.json" -type f -delete || true
          # find release/NicoCache_nl -name "bun.lock" -type f -delete || true
          # find release/NicoCache_nl -name "tsconfig.json" -type f -delete || true
          # find release/NicoCache_nl -name ".eslintrc.json" -type f -delete || true
          # find release/NicoCache_nl -name "playwright.config.ts" -type f -delete || true

          # テスト関連ファイルは除外
          find release/NicoCache_nl -name "tests" -type d -exec rm -rf {} + || true
          find release/NicoCache_nl -name "tests-examples" -type d -exec rm -rf {} + || true

          # 7zアーカイブを作成
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#\#}"
          cd release
          7z a -t7z "../filter-matome-${VERSION}.7z" NicoCache_nl/

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: filter-matome-*.7z
          retention-days: 1

  # ─────────────────────────────────────────────
  # ジョブ②: リリースノート生成（ビルド不要・並列実行）
  # ─────────────────────────────────────────────
  generate-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 全履歴を取得してリリースノート生成に使用

      - name: Generate release notes
        id: release_notes
        run: |
          # リリースノートを生成
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#\#}"
          echo "## 🎉 filter-matome ${TAG}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 ダウンロード" >> release_notes.md
          echo "- **7Z**: \`filter-matome-${VERSION}.7z\`" >> release_notes.md
          echo "- アーカイブのルートに \`GUIDE.html\` を同梱" >> release_notes.md
          echo "- Java Toolboxのビルド済みJARを \`scripts/java-toolbox/target/\` に同梱（利用者のMavenビルド不要）" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🔄 導入方法" >> release_notes.md
          echo "1. 既存のfilter-matomeのバックアップを作成" >> release_notes.md
          echo "2. ダウンロードしたアーカイブを展開" >> release_notes.md
          echo "3. \`nlFilters\`, \`local\`, \`extensions\`フォルダを上書きコピー" >> release_notes.md
          echo "4. 必要に応じて\`mime.types\`を上書きコピー" >> release_notes.md
          echo "5. ブラウザでハード再読み込み（Ctrl+F5）" >> release_notes.md
          echo "6. \`GUIDE.html\` を開いて \`USAGE GUIDE\` と \`NicoCache_nl SETUP GUIDE\` を確認する" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🛠️ 開発環境の構築" >> release_notes.md
          echo "1. Bun をインストール" >> release_notes.md
          echo "2. \`cd local/features && bun install\` でフィーチャー開発環境を構築" >> release_notes.md
          echo "3. 各機能の README.md を参照してビルド・開発を開始" >> release_notes.md
          echo "" >> release_notes.md
          echo "### ⚠️ 注意事項" >> release_notes.md
          echo "- 更新前に各機能の設定をエクスポートすることを推奨" >> release_notes.md
          echo "- 詳細な変更内容は[CHANGELOG.md](CHANGELOG.md)を確認" >> release_notes.md
          echo "- 問題が発生した場合はクリーンインストールを試行" >> release_notes.md
          echo "" >> release_notes.md

          # 最新のコミットメッセージを追加
          echo "### 📝 このリリースの変更内容" >> release_notes.md
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> release_notes.md || echo "- filter-matome ${GITHUB_REF#refs/tags/} リリース" >> release_notes.md

          echo "" >> release_notes.md
          echo "### 📄 CHANGELOG 抜粋" >> release_notes.md
          # Keep a Changelog format: ## [#VERSION] - YYYY-MM-DD
          SECTION_RE="^##[ ]*\[${TAG}\]"
          if grep -E -q -- "${SECTION_RE}" CHANGELOG.md; then
            awk -v tag="${TAG}" '
              BEGIN { p=0; re="^##[ ]*\\[" tag "\\]" }
              $0 ~ re { p=1; print ""; print "<details><summary>CHANGELOG.md からの抜粋</summary>\n"; print ""; print $0; next }
              p && /^## \[/ { p=0; print ""; print "</details>" }
              p { print }
              END { if (p==1) { print ""; print "</details>" } }
            ' CHANGELOG.md >> release_notes.md
          else
            echo "- 該当するセクションが見つかりませんでした。全文は CHANGELOG.md を参照してください。" >> release_notes.md
          fi

      - name: Fallback notes for decimal tags
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            *.*)
              TAG_MAJOR="${TAG%%.*}"
              SECTION_RE="^##[ ]*\[${TAG_MAJOR}\]"
              if grep -E -q -- "${SECTION_RE}" CHANGELOG.md; then
                awk -v tag="${TAG_MAJOR}" '
                  BEGIN { p=0; re="^##[ ]*\\[" tag "\\]" }
                  $0 ~ re { p=1; print ""; print "<details><summary>CHANGELOG.md からの抜粋</summary>\n"; print ""; print $0; next }
                  p && /^## \[/ { p=0; print ""; print "</details>" }
                  p { print }
                  END { if (p==1) { print ""; print "</details>" } }
                ' CHANGELOG.md >> release_notes.md
              fi
              ;;
          esac

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1

  # ─────────────────────────────────────────────
  # ジョブ③: GitHub Release 作成（build・generate-notes 完了後）
  # ─────────────────────────────────────────────
  release:
    needs: [build, generate-notes]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive
        uses: actions/download-artifact@v8
        with:
          name: release-archive

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: filter-matome-*.7z
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release badge
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#\#}"
          echo "✅ Release ${TAG} created successfully!"
          echo "📦 Archive: filter-matome-${VERSION}.7z"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
